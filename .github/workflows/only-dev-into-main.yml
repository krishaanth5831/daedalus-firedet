name: only-dev-into-main
on:
  pull_request:
    branches: [main]
jobs:
  only-dev-into-main:
    runs-on: ubuntu-latest
    steps:
      - name: PRs into main must come from dev
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "PRs into main must come from dev (got '${{ github.head_ref }}')"
            exit 1
          fi
